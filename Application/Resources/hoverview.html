<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html>
    <head>
        <meta http-equiv="Content-type" content="text/html; charset=utf-8">
        <title></title>
        
        <script type="text/javascript" src="multiplexresource://jquery.js"></script>
        <script type="text/javascript">
        
            jQuery(document).ready(function() {
                var pb = $('#playbutton');
                if (pb != null) {
                    pb.bind("mousedown", function() {
                        $(this).attr('src', 'multiplexresource://play-button-small-dwn.png');
                    });
                    pb.bind("mouseup", function() {
                        $(this).attr('src', 'multiplexresource://play-button-small.png');
                    });
                    pb.bind("mouseleave", function() {
                        $(this).attr('src', 'multiplexresource://play-button-small.png');
                    });
                }
            });
               
        </script>
    </head>
    <body id="hoverview" onload="">
		<div id="tooltip" class="<!--[POINTER-ID]-->">
			<div id="tooltip-inner">
				<div id="tooltip-top"></div>
				<div id="tooltip-title-top"></div>
				<h3 id="title"><!--[TITLE]--></h3>
				<div id="tooltip-title-bottom"></div>
				<div id="info">
					<table>
						<tr id="time">
							<th>Time:</th> <td><!--[TIME]--></td>
						</tr>
						<tr id="rating">
							<th>Rating:</th> <td><!--[RATING]--></td>
						</tr>
						<tr id="open">
							<th>&nbsp;</th> <td><a href="multiplex://OPEN_MOVIE">Open Movie Info</a></td>
						</tr>
					</table>
					<!--[PLAY_MOVIE]
                    <div id="playbuttondiv">
                        <a href="multiplex://PLAY_MOVIE">
                            <img src="multiplexresource://play-button-small.png" id="playbutton" />
                        </a>
                    </div>
                    [PLAY_MOVIE]-->
					<div id="tooltip-pointer"></div>
				</div>
				<div id="tooltip-bottom"></div>
			</div>
		</div>
    </body>
</html>
