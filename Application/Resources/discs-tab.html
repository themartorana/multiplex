<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>

	<meta http-equiv="Content-Language" content="en-us" />
	<title>Multiplex Discs Tab Disc Hover View</title>
    
    <script type="text/javascript" src="multiplexresource://jquery.js"></script>
    <script type="text/javascript" src="multiplexresource://jquery-ui.js"></script>
    <script type="text/javascript">
    
        function resetDiscs(movieJSONText) {
        
            // Clear out the discs li tags
            var discsOL = $("#discs");
            discsOL.empty();
            
            eval("var movie = " + movieJSONText);
            
            try {
                var discs = movie.discs;

                for (var i = 0; i < discs.length; i++) {
                    var disc = discs[i];

                    var li = jQuery("<li></li>").addClass("disc").attr("id", disc.objectID);
                    discsOL.append(li);
                    
                    var img = jQuery("<img></img>");
                    
                    // Append the image
                    if (disc.isDVD == "YES") {
                        imgSrc = "multiplexresource://disc-dvd-sm.png";
                    }
                    else {
                        imgSrc = "multiplexresource://disc-blank-sm.png";
                    }
                    li.append(jQuery("<img></img>").attr("src", imgSrc));
                    
                    // Append the title
                    var dTitle = null;
                    if (disc.title != "" && disc.title != null) {
                        dTitle = disc.title;
                    }
                    else { 
                        if (disc.isDVD == "NO" || discs.length == 1) {
                            dTitle = movie.title;
                        }
                        else {
                            dTitle = "Disc " + disc.number;
                        }
                    }
                    li.append(jQuery("<div></div>").addClass("pos").append(dTitle));

                    // Append the synopsis
                    //li.append(jQuery("<div></div>").addClass("desc").append(disc.synopsis));
                    
                    // Append the options
                    var menu = jQuery("<div></div>").addClass("menu");
                    var ul = jQuery("<ul></ul>").addClass("options");
                    menu.append(ul);
                    li.append(menu);
                    
                    // Add in play button
                    var playButton = jQuery("<li></li>").addClass("option play").append("Play");
                    ul.append(playButton);
                    playButton.bind("click", disc, function(e) {
                        mplex.playDisc(e.data.objectID);
                    });
                    
                    // Add Drag
                    if (discs.length > 1) {
                        ul.append(jQuery("<li></li>").addClass("option drag").append("&larr;&nbsp;Drag to Reorder&nbsp;&rarr;"));
                    }
                    
                    // Add Rename
                    var renameButton = jQuery("<li></li>").addClass("option").append("Rename Disc");
                    ul.append(renameButton);
                    renameButton.bind("click", disc, function(e) {
                        mplex.renameDisc(e.data.objectID);
                    });
                    
                    // Add Drop From Set
                    if (discs.length > 1) {
                        var dropFromSetButton = jQuery("<li></li>").addClass("option").append("Drop From Set");
                        ul.append(dropFromSetButton);
                        dropFromSetButton.bind("click", disc, function(e) {
                            mplex.removeFromSet(e.data.objectID);
                        });
                    }

                    // Add Send To Trash
                    ul.append(jQuery("<li></li>").addClass("option").append("Send to Trash"));
                }
            } 
            catch (err) {
                alert(err);
            }
        }
        
        jQuery(document).ready(function() {
            mplex.signalIsReady();
            
            // Sortable
            $("#discs").sortable({ 
                handle : '.drag', 
                axis: 'x',
                tolerance: 'pointer',
                containment: $('.set'),
                update : function () { 
                  var orderArray = $('#discs').sortable('toArray'); 
                  mplex.reorderDiscs(orderArray);
                } 
            });
        });
        
        
    
    </script>
	
</head>

<body>

    <div class="set">
        <ol id="discs" class="discs">
            <!--
            <li class="disc">
                <img src="images/disc-dvd.png" width="158" height="158" />
                <div class="pos">Disc 1</div>
                <div class="desc">Feature Presentation</div>
                <div class="menu">
                    <ul class="options">
                        <li class="option play">Play</li>
                        <li class="option">Drop From Set</li>
                        <li class="option">Reveal in Finder</li>
                        <li class="option">Send to Trash</li>
                        <li class="option drag">&larr;&nbsp;Drag to Reorder&nbsp;&rarr;</li>
                    </ul>
                </div>
            </li>
            -->
        </ol>
    </div>
	
</body>


</html>
