<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>

	<meta http-equiv="Content-Language" content="en-us" />
	<title>Multiplex Discs Tab Disc Hover View</title>
    
    <script type="text/javascript" src="multiplexresource://jquery.js"></script>
    <script type="text/javascript" src="multiplexresource://jquery-ui.js"></script>
    <script type="text/javascript">
    
        function resetDiscs(movieJSONText) {
        
            // Clear out the discs li tags
            var discsOL = $("#discs");
            discsOL.empty();
            
            eval("var movie = " + movieJSONText);
            
            try {
                var discs = movie.discs;

                for (var i = 0; i < discs.length; i++) {
                    var disc = discs[i];

                    var li = jQuery("<li></li>").addClass("disc").attr("id", disc.objectID);
                    discsOL.append(li);
                    
                    // Add Drag
                    if (discs.length > 1) {
						var drag = jQuery("<div></div>").addClass("drag").append("&larr;&nbsp;Drag&nbsp;&rarr;")
                        li.append(drag);
                    }
                    
                    // Append the image
                    if (disc.isDVD == "YES") {
                        imgSrc = "multiplexresource://disc-dvd-sm.png";
                    }
                    else {
                        imgSrc = "multiplexresource://disc-blank-sm.png";
                    }
                    li.append(jQuery("<img></img>").addClass("disc-art").attr("src", imgSrc));
                    
                    // Append the title
                    var dTitle = null;
                    if (disc.title != "" && disc.title != null) {
                        dTitle = disc.title;
                    }
                    else { 
                        if (disc.isDVD == "NO" || discs.length == 1) {
                            dTitle = movie.title;
                        }
                        else {
                            dTitle = "Disc " + disc.number;
                        }
                    }
                    li.append(jQuery("<div></div>").addClass("pos").append(dTitle));

                    // Append the menu
                    var menu = jQuery("<div></div>").addClass("menu");
                    var ul = jQuery("<ul></ul>").addClass("options");
                    menu.append(ul);
                    li.append(menu);
                    
					// Add Rename Button
                    var renameButton = jQuery("<li></li>").addClass("option rename").text("R").attr("title", "Rename Disc");
                    ul.append(renameButton);
                    renameButton.bind("click", disc, function(e) {
                        mplex.renameDisc(e.data.objectID);
                    }).css('cursor', 'pointer');
					
                    // Add Remove From Set Button
                    if (discs.length > 1) {
                        var removeFromSetButton = jQuery("<li></li>").addClass("option remove").html("&ndash;").attr("title", "Detach From Set");
                        ul.append(removeFromSetButton);
                        removeFromSetButton.bind("click", disc, function(e) {
                            mplex.removeFromSet(e.data.objectID);
                        }).css('cursor', 'pointer');
                    }
					
                    // Add Delete From Multiplex
					var deleteFromAppButton = jQuery("<li></li>").addClass("option delete").text("X").attr("title", "Delete From Multiplex");
                    ul.append(deleteFromAppButton);
					deleteFromAppButton.bind("click", disc, function(e) {
						// mplex.deleteFromApp(e.data.objectID);
					}).css('cursor', 'pointer');
                    
                    // Add Play Button
                    var playButton = jQuery("<li></li>").addClass("option play").html("&gt;").attr("title", "Play");
                    ul.append(playButton);
                    playButton.bind("click", disc, function(e) {
                        mplex.playDisc(e.data.objectID);
                    }).css('cursor', 'pointer');
					
					// Add Play on Double-Click
					li.find('img.disc-art').bind("dblclick", disc, function(e) {
						mplex.playDisc(e.data.objectID);
					}).css('cursor', 'pointer');
					
                    // Add hover fade-in for menu
                    li.bind("mouseenter", function() {
                        $(this).find('.menu,.drag').fadeIn('fast');
                    });
                    li.bind("mouseleave", function() {
                        $(this).find('.menu,.drag').fadeOut('fast');
                    });
                    
                }
            } 
            catch (err) {
                alert(err);
            }
        }
        
        jQuery(document).ready(function() {
            mplex.signalIsReady();
            
            // Sortable
            $("#discs").sortable({ 
                handle : '.drag', 
                axis: 'x',
                tolerance: 'pointer',
                containment: '.set',
				start: function (e,ui) {
					$(ui.helper).find('.menu').fadeOut(50);
				},
				end: function (e,ui) {
					$(ui.helper).find('.menu').fadeIn(50);
				},
                update : function () { 
					var orderArray = $('#discs').sortable('toArray'); 
					mplex.reorderDiscs(orderArray);
                } 
            });
        });
        
        
    
    </script>
	
</head>

<body>

    <div class="set">
        <ol id="discs" class="discs">
            <!--
            <li class="disc">
                <img src="images/disc-dvd.png" width="158" height="158" />

</body>


</html>
